<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eleição: Site Mais Criativo C.E.I.A.S</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🏆 Votação: Site Mais Criativo C.E.I.A.S</h1>
    <p>Explore as criações dos alunos e escolha o seu projeto favorito!</p>
  </header>

  <main class="container">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Buscar por autor do projeto..." oninput="filtrarSites()">
    </div>

    <section class="grid-sites" id="grid-sites">
      <!-- Cards gerados via JS -->
    </section>

    <section class="ranking-container">
      <h2>📊 Ranking Parcial</h2>
      <ul id="ranking-list">
        <!-- Ranking gerado via JS -->
      </ul>
      <button class="btn-reset" onclick="resetarVotacao()">Resetar Votação (Modo Teste)</button>
    </section>
  </main>

  <!-- Modal de Preview em Tela Cheia -->
  <div id="preview-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Preview do Projeto</h3>
        <button class="close-btn" onclick="fecharModal()">&times;</button>
      </div>
      <div class="modal-body">
        <iframe id="modal-iframe" src="" title="Preview Completo"></iframe>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Eleição de Sites Criativos C.E.I.A.S</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
